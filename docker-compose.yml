services:
  # =====================
  # POSTGRES
  # =====================
  postgres:
    image: postgres:16
    container_name: weddme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weddme-network

  # =====================
  # PGADMIN
  # =====================
  pgadmin:
    image: dpage/pgadmin4
    container_name: weddme-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - weddme-network

  # =====================
  # REDIS
  # =====================
  redis:
    image: redis:7
    container_name: weddme-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - weddme-network

  # =====================
  # REDIS INSIGHT
  # =====================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: weddme-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - weddme-network

  # =====================
  # BACKEND (NESTJS)
  # =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weddme-backend
    restart: unless-stopped
    env_file:
      - .env
      - backend/.env.${ENVIRONMENT:-development}
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    networks:
      - weddme-network

  # =====================
  # ADMIN PANEL (NEXTJS)
  # =====================
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: weddme-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PANEL_PORT}:3000"
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - weddme-network

  # =====================
  # FRONTEND (NEXTJS)
  # =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weddme-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - weddme-network

# =====================
# VOLUMES
# =====================
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

    # pgadmin_data:
    #   driver: local
    #   driver_opts:
    #     type: none
    #     o: bind
    #     device: ${PGADMIN_DATA_PATH:-./data/pgadmin}

    # postgres_data:
    #   driver: local
    #   driver_opts:
    #     type: none
    #     o: bind
    #     device: ${PGDATA_PATH:-./data/postgres}

    # redis_data:
    #   driver: local
    #   driver_opts:
    #     type: none
    #     o: bind
    #     device: ${REDIS_DATA_PATH:-./data/redis}

    # =====================
    # NETWORK
    # =====================
networks:
  weddme-network:
    driver: bridge
